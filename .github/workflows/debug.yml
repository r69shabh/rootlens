name: debug
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python /tmp/probe2.py
      - name: upload probe
        if: always()
        run: cat /tmp/probe2.py
